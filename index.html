<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Blast // Neon Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>

  <!-- Particle Canvas Overlay -->
  <canvas id="particleCanvas"></canvas>

  <!-- Start Menu -->
  <div id="startMenu">
    <h1>BLOCK<br><span class="title-accent">BLAST</span></h1>
    <p class="subtitle">NEON PUZZLE GAME</p>
    <button id="startButton">Start Game</button>
    <button id="settingsButton">Settings</button>
    <p id="highScoreDisplay">High Score: 0</p>
  </div>

  <!-- Settings Panel (hidden by default) -->
  <div id="settingsPanel" class="modal" style="display:none;">
    <div class="modal-content">
      <h2>Settings</h2>
      <label for="sfxVolume">SFX Volume:</label>
      <input type="range" id="sfxVolume" min="0" max="1" step="0.1" value="0.5">
      <br>
      <button id="closeSettings">Close</button>
    </div>
  </div>

  <!-- Main Game Container (hidden until game starts) -->
  <div id="gameContainer" style="display:none;">
    <!-- Score Board -->
    <div id="scoreBoard">
      <div class="score-row">
        <span class="score-label">Score</span>
        <span id="score" class="score-value">0</span>
        <span id="comboDisplay" class="combo-display" style="display:none;">x<span id="comboCount">1</span></span>
      </div>
      <div class="score-row">
        <span class="score-label">Best</span>
        <span id="highScore" class="score-value">0</span>
      </div>
      <button id="openSettings">&#9881;</button>
    </div>
    <!-- Score popup container for floating text -->
    <div id="scorePopupContainer"></div>
    <!-- 8x8 Game Board Grid -->
    <div id="gameBoard">
      <!-- Cells will be generated by JavaScript -->
    </div>
    <!-- Piece Tray for upcoming blocks -->
    <div id="pieceTray">
      <!-- Piece previews will be injected here -->
    </div>
    <!-- Game Over overlay -->
    <div id="gameOver" style="display:none;">
      <h2>Game Over</h2>
      <p>Your Score: <span id="finalScore"></span></p>
      <p id="gameOverHighScore"></p>
      <button id="restartButton">Play Again</button>
    </div>
  </div>

  <!-- Audio Assets -->
  <audio id="placeSound" src="assets/pop.mp3" preload="auto"></audio>
  <audio id="clearSound" src="assets/squish.mp3" preload="auto"></audio>
  <audio id="gameoverSound" src="assets/gameover.mp3" preload="auto"></audio>

  <!-- Scripts -->
  <script src="js/particles.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
